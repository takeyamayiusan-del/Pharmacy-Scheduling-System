# Railway Nixpacks Configuration
# 耀聖藥局智慧排班系統

[phases.setup]
  nixpkgsArchive = "77e746c99400f292e2b4f2647763575586b098f6"
  nixLibs = ["nodejs_20", "npm"]

[phases.install]
  cmds = ["npm install"]
  dependsOn = ["setup"]

[phases.build]
  cmds = ["npm run build"]
  dependsOn = ["install"]

[start]
  cmd = "npm start"
  dependsOn = ["build"]
